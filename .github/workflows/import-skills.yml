# STAGING COPY — GitHub Actions only runs workflows from .github/workflows/ on the default branch.
# To activate: create a file at .github/workflows/import-skills.yml with EXACTLY this content
# (GitHub web UI → Add file → Create new file → type the path → paste → Commit).
# The import run triggers automatically on that commit.

name: import-skill-packages

on:
  push:
    paths:
      - 'URLS.json'
      - '.github/workflows/import-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-skills
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        run: |
          set -euo pipefail
          mkdir -p incoming
          python3 - <<'PY'
          import json, subprocess, sys, os
          urls = json.load(open('URLS.json'))
          failed = []
          for name, url in urls.items():
              out = f"incoming/{name}.skill"
              ok = False
              for attempt in range(4):
                  r = subprocess.run(['curl', '-fSL', '--retry', '3', '--max-time', '600', '-o', out, url])
                  if r.returncode == 0 and os.path.getsize(out) > 100:
                      ok = True
                      break
              if ok:
                  print(f"downloaded {name} ({os.path.getsize(out)} bytes)")
              else:
                  print(f"FAILED: {name}", file=sys.stderr)
                  failed.append(name)
          if failed:
              print("failed: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Validate, hash, and place packages
        run: |
          python3 - <<'PY'
          import json, hashlib, os, zipfile
          os.makedirs('packages', exist_ok=True)
          manifest = {}
          for fn in sorted(os.listdir('incoming')):
              name = fn[:-6]  # strip .skill
              src = os.path.join('incoming', fn)
              data = open(src, 'rb').read()
              if len(data) < 100:
                  raise SystemExit(f"{name}: suspiciously small ({len(data)} bytes)")
              zf = zipfile.ZipFile(src)
              if zf.testzip() is not None:
                  raise SystemExit(f"{name}: corrupt zip")
              if not any(n.endswith('/SKILL.md') or n == 'SKILL.md' for n in zf.namelist()):
                  raise SystemExit(f"{name}: no SKILL.md inside")
              manifest[name] = {
                  "file": f"packages/{name}.skill",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }
              os.replace(src, os.path.join('packages', fn))
              print(f"verified {name}: {len(data)} bytes, sha256 {manifest[name]['sha256'][:16]}...")
          if len(manifest) != 71:
              raise SystemExit(f"expected 71 packages, got {len(manifest)}")
          with open('MANIFEST.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f"MANIFEST.json written with {len(manifest)} entries")
          PY

      - name: Commit packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ MANIFEST.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Import 71 verified .skill packages (zip + SKILL.md checked, sha256 in MANIFEST.json)"
            git push
          fi
